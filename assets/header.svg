<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Vaibhav Pokhriyal - AI Engineer, Biosignal Systems, Agentic AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060A1E"/>
      <stop offset="0.6" stop-color="#0B1230"/>
      <stop offset="1" stop-color="#160C2A"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E23636" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E23636" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EC8FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5EC8FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#5EC8FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.28"/>
    </pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="2" height="2" fill="#2B59C3" opacity="0.35"/>
    </pattern>
    <clipPath id="floor"><rect x="0" y="282" width="1200" height="138"/></clipPath>
    <clipPath id="g1"><rect x="0" y="120" width="1200" height="10">
      <animate attributeName="y" values="120;168;132;190;150;120" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;8;0;14;0;0" dur="2.6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="g2"><rect x="0" y="150" width="1200" height="10">
      <animate attributeName="y" values="185;140;176;128;160;185" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="height" values="0;0;10;0;6;0" dur="3.1s" repeatCount="indefinite"/>
    </rect></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .name{font-size:76px;font-weight:800;letter-spacing:6px}
      .t{fill:#A8B0D0;font-size:13px;letter-spacing:2px}
      .cy{fill:#5EC8FF}.rd{fill:#E23636}.wh{fill:#E8E8F0}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .type{animation:type 3.2s steps(46) 0.4s both}
      @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
      .rise{animation:rise 1.2s ease-out both}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .px{animation:twinkle 3s ease-in-out infinite}
      @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>

  <!-- horizon glow + perspective grid floor -->
  <rect x="0" y="240" width="1200" height="60" fill="url(#horizon)" opacity="0.5"/>
  <g clip-path="url(#floor)" stroke="#2B59C3" stroke-width="1" opacity="0.7">
    <g>
      <line x1="0" y1="290" x2="1200" y2="290"/><line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="314" x2="1200" y2="314"/><line x1="0" y1="332" x2="1200" y2="332"/>
      <line x1="0" y1="356" x2="1200" y2="356"/><line x1="0" y1="386" x2="1200" y2="386"/>
      <line x1="0" y1="422" x2="1200" y2="422"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <path d="M600 282 L-600 420 M600 282 L-300 420 M600 282 L0 420 M600 282 L200 420 M600 282 L400 420 M600 282 L600 420 M600 282 L800 420 M600 282 L1000 420 M600 282 L1200 420 M600 282 L1500 420 M600 282 L1800 420"/>
  </g>
  <line x1="0" y1="282" x2="1200" y2="282" stroke="#E23636" stroke-width="1.5" opacity="0.8"/>

  <!-- floating pixels -->
  <g>
    <rect class="px" x="96" y="96" width="6" height="6" fill="#E23636"/>
    <rect class="px" x="1090" y="120" width="6" height="6" fill="#5EC8FF" style="animation-delay:.7s"/>
    <rect class="px" x="1040" y="230" width="4" height="4" fill="#E23636" style="animation-delay:1.3s"/>
    <rect class="px" x="150" y="230" width="4" height="4" fill="#5EC8FF" style="animation-delay:2s"/>
    <rect class="px" x="980" y="80" width="4" height="4" fill="#E8E8F0" style="animation-delay:.3s"/>
    <rect class="px" x="220" y="70" width="4" height="4" fill="#E8E8F0" style="animation-delay:1.7s"/>
    <rect class="px" x="60" y="190" width="6" height="6" fill="#2B59C3" style="animation-delay:1s"/>
    <rect class="px" x="1130" y="200" width="6" height="6" fill="#2B59C3" style="animation-delay:2.4s"/>
  </g>

  <!-- top HUD bar -->
  <g class="mono">
    <rect x="24" y="22" width="1152" height="28" fill="#0B1230" stroke="#2B59C3" stroke-opacity="0.6"/>
    <rect x="24" y="22" width="6" height="28" fill="#E23636"/>
    <text x="42" y="41" class="t"><tspan class="cy">SYS://</tspan>VAIBHAV.POKHRIYAL<tspan fill="#2B59C3">  ::  </tspan>B.TECH CSE (AI&amp;ML) · GBPIET</text>
    <circle cx="1010" cy="36" r="4.5" fill="#3BE37A" class="blink"/>
    <text x="1022" y="41" class="t">ONLINE · 2026</text>
  </g>

  <!-- name with glitch layers -->
  <g class="mono name" text-anchor="middle">
    <text x="600" y="178" fill="#E23636" opacity="0.55" filter="url(#soft)">VAIBHAV POKHRIYAL</text>
    <text x="600" y="178" class="wh" filter="url(#glow)">VAIBHAV POKHRIYAL</text>
    <g clip-path="url(#g1)"><text x="612" y="178" fill="#5EC8FF">VAIBHAV POKHRIYAL</text></g>
    <g clip-path="url(#g2)"><text x="586" y="178" fill="#E23636">VAIBHAV POKHRIYAL</text></g>
  </g>

  <!-- role line -->
  <g class="mono rise" text-anchor="middle" font-size="19" font-weight="700" letter-spacing="4">
    <text x="600" y="222"><tspan class="rd">AI ENGINEER</tspan><tspan fill="#2B59C3">  ▮  </tspan><tspan class="cy">BIOSIGNAL SYSTEMS</tspan><tspan fill="#2B59C3">  ▮  </tspan><tspan class="wh">AGENTIC AI</tspan></text>
  </g>

  <!-- terminal prompt -->
  <g class="mono" font-size="15">
    <g class="type">
      <text x="600" y="258" text-anchor="middle" fill="#A8B0D0"><tspan class="rd">❯</tspan> from signal to insight · from model to deployment_</text>
    </g>
  </g>

  <!-- EEG trace on the floor -->
  <path d="M0 352 L120 352 L140 352 L150 330 L160 372 L172 318 L184 386 L196 352 L320 352 L340 344 L352 360 L364 352 L480 352 L492 300 L504 398 L516 336 L528 352 L700 352 L712 340 L724 364 L736 352 L860 352 L874 316 L886 380 L898 342 L910 352 L1060 352 L1072 334 L1084 368 L1096 352 L1200 352"
        fill="none" stroke="#E23636" stroke-width="2.4" stroke-linejoin="round" filter="url(#glow)"
        stroke-dasharray="1600" stroke-dashoffset="1600">
    <animate attributeName="stroke-dashoffset" values="1600;0;-1600" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- corner brackets -->
  <g stroke="#E23636" stroke-width="3" fill="none">
    <path d="M14 82 V64 M14 64 H32" /><path d="M1186 82 V64 M1186 64 H1168"/>
    <path d="M14 388 V406 H32"/><path d="M1186 388 V406 H1168"/>
  </g>
  <g class="mono" font-size="11" fill="#5EC8FF" opacity="0.8">
    <text x="24" y="400">LAT 30.15N · LON 78.78E</text>
    <text x="1176" y="400" text-anchor="end">EEG · EMG · EOG · LLM · MCP</text>
  </g>

  <!-- sweeping scan bar + scanlines -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#fade)" opacity="0.8">
    <animate attributeName="y" values="0;420" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="420" fill="url(#scan)"/>
</svg>
