<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="From signal to insight. From model to deployment. From idea to impact.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1230"/><stop offset="1" stop-color="#060A1E"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".25"/></pattern>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .l{font-size:20px;font-weight:700;letter-spacing:3px}
      .a{animation:f 9s infinite both}
      .a2{animation-delay:3s}.a3{animation-delay:6s}
      @keyframes f{0%{opacity:0;transform:translateY(8px)}5%,30%{opacity:1;transform:none}36%,100%{opacity:0}}
      .px{animation:rise 4s linear infinite}
      @keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-140px);opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="200" fill="url(#bg)"/>
  <!-- rising pixels -->
  <g>
    <rect class="px" x="80" y="190" width="6" height="6" fill="#E23636"/>
    <rect class="px" x="210" y="190" width="4" height="4" fill="#5EC8FF" style="animation-delay:1.1s"/>
    <rect class="px" x="330" y="190" width="6" height="6" fill="#2B59C3" style="animation-delay:2.3s"/>
    <rect class="px" x="870" y="190" width="6" height="6" fill="#E23636" style="animation-delay:.6s"/>
    <rect class="px" x="990" y="190" width="4" height="4" fill="#5EC8FF" style="animation-delay:1.8s"/>
    <rect class="px" x="1110" y="190" width="6" height="6" fill="#2B59C3" style="animation-delay:3s"/>
  </g>
  <g class="mono l" text-anchor="middle">
    <text x="600" y="78" class="a" fill="#E8E8F0">FROM <tspan fill="#E23636">SIGNAL</tspan> TO <tspan fill="#5EC8FF">INSIGHT</tspan></text>
    <text x="600" y="78" class="a a2" fill="#E8E8F0">FROM <tspan fill="#E23636">MODEL</tspan> TO <tspan fill="#5EC8FF">DEPLOYMENT</tspan></text>
    <text x="600" y="78" class="a a3" fill="#E8E8F0">FROM <tspan fill="#E23636">IDEA</tspan> TO <tspan fill="#5EC8FF">IMPACT</tspan></text>
  </g>
  <path d="M0 140 L200 140 L216 124 L228 158 L240 112 L254 166 L268 140 L520 140 L534 120 L548 160 L562 140 L640 140 L652 104 L664 176 L676 130 L688 140 L940 140 L954 124 L968 158 L980 140 L1200 140"
        fill="none" stroke="#E23636" stroke-width="2" filter="url(#glow)" stroke-dasharray="1500" stroke-dashoffset="1500">
    <animate attributeName="stroke-dashoffset" values="1500;0;-1500" dur="5s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="188" text-anchor="middle" class="mono" font-size="11" letter-spacing="3" fill="#5EC8FF" opacity=".75">// END OF TRANSMISSION · VAIBHAV668 · 2026</text>
  <rect width="1200" height="200" fill="url(#scan)"/>
</svg>
