<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Current focus: MCP Shield, leopard alert system field validation, seizure detection paper, NetraVaani EMG dataset, DSA, CS fundamentals and SQL">
  <defs>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .h{font-size:13px;letter-spacing:3px;fill:#5EC8FF}
      .n{font-size:16px;font-weight:700;fill:#E8E8F0}
      .d{font-size:11.5px;fill:#A8B0D0;letter-spacing:.5px}
      .pc{font-size:14px;font-weight:700;fill:#E8E8F0}
      .tag{font-size:10px;font-weight:700;letter-spacing:2px}
      .blink{animation:b 1.1s steps(1) infinite}@keyframes b{50%{opacity:0}}
    </style>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#B11226"/><stop offset="1" stop-color="#E23636"/></linearGradient>
    <linearGradient id="gb" x1="0" x2="1"><stop offset="0" stop-color="#2B59C3"/><stop offset="1" stop-color="#5EC8FF"/></linearGradient>
    <pattern id="seg" width="10" height="12" patternUnits="userSpaceOnUse"><rect x="8" width="2" height="12" fill="#0B1230"/></pattern>
  </defs>
  <rect width="1200" height="400" fill="#0B1230"/>
  <rect x="12" y="12" width="1176" height="376" fill="none" stroke="#2B59C3" stroke-opacity=".6"/>
  <g class="mono">
    <rect x="12" y="12" width="1176" height="34" fill="#0E1840"/>
    <text x="30" y="34" class="h">▸ ACTIVE_PROCESSES</text>
    <circle cx="1060" cy="29" r="4" fill="#E23636" class="blink"/>
    <text x="1072" y="34" class="h" fill="#E23636" style="fill:#E23636">LIVE</text>
  </g>

  <!-- rows: y step 56 -->
  <g class="mono">
    <!-- 1 -->
    <text x="34" y="80" class="n">MCP Shield</text>
    <text x="34" y="98" class="d">runtime security proxy for AI agents · hardening policies</text>
    <rect x="560" y="76" width="480" height="14" fill="#13204F"/>
    <rect x="560" y="76" width="0" height="14" fill="url(#g)"><animate attributeName="width" from="0" to="432" dur="1.6s" fill="freeze"/></rect>
    <rect x="560" y="76" width="480" height="14" fill="url(#seg)"/>
    <text x="1060" y="89" class="pc">90%</text>
    <rect x="1110" y="76" width="64" height="16" fill="none" stroke="#3BE37A"/><text x="1142" y="88" class="tag" fill="#3BE37A" text-anchor="middle">SHIP</text>

    <!-- 2 -->
    <text x="34" y="136" class="n">Campus Leopard Alert</text>
    <text x="34" y="154" class="d">field validation on live campus CCTV · night &amp; low light</text>
    <rect x="560" y="132" width="480" height="14" fill="#13204F"/>
    <rect x="560" y="132" width="0" height="14" fill="url(#gb)"><animate attributeName="width" from="0" to="336" dur="1.6s" begin=".15s" fill="freeze"/></rect>
    <rect x="560" y="132" width="480" height="14" fill="url(#seg)"/>
    <text x="1060" y="145" class="pc">70%</text>
    <rect x="1110" y="132" width="64" height="16" fill="none" stroke="#5EC8FF"/><text x="1142" y="144" class="tag" fill="#5EC8FF" text-anchor="middle">TEST</text>

    <!-- 3 -->
    <text x="34" y="192" class="n">Seizure Detection Paper</text>
    <text x="34" y="210" class="d">hybrid spatiotemporal GNN · manuscript in preparation</text>
    <rect x="560" y="188" width="480" height="14" fill="#13204F"/>
    <rect x="560" y="188" width="0" height="14" fill="url(#g)"><animate attributeName="width" from="0" to="312" dur="1.6s" begin=".3s" fill="freeze"/></rect>
    <rect x="560" y="188" width="480" height="14" fill="url(#seg)"/>
    <text x="1060" y="201" class="pc">65%</text>
    <rect x="1110" y="188" width="64" height="16" fill="none" stroke="#E23636"/><text x="1142" y="200" class="tag" fill="#E23636" text-anchor="middle">WRITE</text>

    <!-- 4 -->
    <text x="34" y="248" class="n">NetraVaani Band</text>
    <text x="34" y="266" class="d">per-finger wrist EMG dataset · gesture classification</text>
    <rect x="560" y="244" width="480" height="14" fill="#13204F"/>
    <rect x="560" y="244" width="0" height="14" fill="url(#gb)"><animate attributeName="width" from="0" to="216" dur="1.6s" begin=".45s" fill="freeze"/></rect>
    <rect x="560" y="244" width="480" height="14" fill="url(#seg)"/>
    <text x="1060" y="257" class="pc">45%</text>
    <rect x="1110" y="244" width="64" height="16" fill="none" stroke="#5EC8FF"/><text x="1142" y="256" class="tag" fill="#5EC8FF" text-anchor="middle">BUILD</text>

    <!-- 5 -->
    <text x="34" y="304" class="n">DSA Grind</text>
    <text x="34" y="322" class="d">200+ solved · target 300 quality problems</text>
    <rect x="560" y="300" width="480" height="14" fill="#13204F"/>
    <rect x="560" y="300" width="0" height="14" fill="url(#g)"><animate attributeName="width" from="0" to="320" dur="1.6s" begin=".6s" fill="freeze"/></rect>
    <rect x="560" y="300" width="480" height="14" fill="url(#seg)"/>
    <text x="1060" y="313" class="pc">67%</text>
    <rect x="1110" y="300" width="64" height="16" fill="none" stroke="#E23636"/><text x="1142" y="312" class="tag" fill="#E23636" text-anchor="middle">GRIND</text>

    <!-- 6 -->
    <text x="34" y="360" class="n">CS Fundamentals + SQL</text>
    <text x="34" y="378" class="d">DBMS · OS · Computer Networks · PostgreSQL in depth</text>
    <rect x="560" y="356" width="480" height="14" fill="#13204F"/>
    <rect x="560" y="356" width="0" height="14" fill="url(#gb)"><animate attributeName="width" from="0" to="264" dur="1.6s" begin=".75s" fill="freeze"/></rect>
    <rect x="560" y="356" width="480" height="14" fill="url(#seg)"/>
    <text x="1060" y="369" class="pc">55%</text>
    <rect x="1110" y="356" width="64" height="16" fill="none" stroke="#5EC8FF"/><text x="1142" y="368" class="tag" fill="#5EC8FF" text-anchor="middle">LEARN</text>
  </g>
</svg>
